<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Open Library Book Finder</title>
    <link rel="stylesheet" type="text/css" href="styles.css">

    <script src="main.js" defer></script>

</head>
<body>
    <header id="webpage-title">
        <div class="container">
            <h1>Open Library Search Engine</h1>
        </div>
    </header>
    <!-- search box section-->
    <section id="search-box-sec">
        <div class="container">
            <div class="search-box">
                <input type="text" id="user-search" placeholder="Enter book title or author (Ex: Hunger Games, Suzanne Collins) ...">
                <button id="search-button">Search</button>
            </div>
        </div>
    </section>
    <!-- search results section -->
    <section id="search-results-sec">
        <div class="container">
            <div id="book-results">Type above and click search button for results</div>
        </div>
    </section>
</body>
</html>
